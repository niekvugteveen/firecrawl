services:
  api:
    # Upstream ships no restart policy on any service, so a host reboot -- or a
    # single cold-start overrun like the one below -- leaves the whole stack
    # down until someone starts it by hand. Every other service on this box
    # (searxng, grafana) runs unless-stopped; match that.
    restart: unless-stopped
    environment:
      # Rarely-used self-hosted instance: shrink the nuq worker pool from the
      # upstream default of 5 to 2. Each nuq-worker is a full Node process
      # (~320 MB resident regardless of traffic), so this frees ~950 MB. Two
      # workers is ample throughput for this instance's low request volume.
      NUQ_WORKER_COUNT: "2"
      # harness.js waits for the API to bind :3002 and hard-exits(1) if it does
      # not. On this 2-vCPU host a full-stack cold start (api + 2 nuq workers +
      # extract worker, all booting at once) has overrun the 60s upstream
      # default and killed the container. 180s leaves headroom; it only affects
      # how long a genuinely broken start waits before giving up.
      HARNESS_STARTUP_TIMEOUT_MS: "180000"
    # Upstream's 8G is a third of this 11.7G host, and the api container alone
    # would not be the thing that ran it out of memory -- it would just be the
    # one still standing. `api` is not one process: harness.js supervises seven
    # Node processes (api, queue-worker, extract-worker, 2x nuq-worker,
    # nuq-prefetch, nuq-reconciler), six of which idle at ~320 MB each because
    # the same bundle is loaded into six separate V8 heaps. Measured 2026-08-19:
    # 1.57 GiB steady, cgroup high-water 2011 MiB.
    #
    # Caveat on that peak: it covers only 20 minutes, because the container had
    # just restarted -- and a cold start, where all seven boot at once, is the
    # most memory-intensive moment there is. It is not a 7-day extract-workload
    # peak. 3G is ~1.5x it; if extract jobs ever OOM here, raise it rather than
    # assuming a leak. Observed sitting at 1.805 GiB (60% of the limit) in the
    # minutes after the deploy, against 1.57 GiB steady beforehand -- boot is
    # the expensive part, but this is the one service here with real headroom
    # pressure, so it is the one to watch.
    mem_limit: 3G
    memswap_limit: 3G

  redis:
    restart: unless-stopped
    # Measured high-water over 7 days: 15 MiB. This is a job-coordination cache,
    # not a data store; 256M is pure blast-radius bounding.
    mem_limit: 256M
    memswap_limit: 256M

  nuq-postgres:
    restart: unless-stopped
    # Measured high-water over 7 days: 181 MiB.
    mem_limit: 512M
    memswap_limit: 512M

  playwright-service:
    restart: unless-stopped
    # Measured over 7 days of real scraping: 484 MiB idle, high-water 1455 MiB
    # -- this one genuinely uses its memory, since `channel: chrome` runs full
    # Google Chrome and BROWSER_POOL_SIZE is 5. 2G is ~1.4x the observed peak.
    # Lower this before lowering the pool size: a too-small limit OOM-kills the
    # container mid-scrape, where a smaller pool just queues.
    mem_limit: 2G
    memswap_limit: 2G
    environment:
      # Which desktop platform the browser presents as. See the long comment in
      # apps/playwright-service-ts/api.ts: Cloudflare sites (fragrantica.com)
      # block a Linux claim, Akamai sites (zalando.nl) block a Windows claim
      # because it contradicts the real Linux TLS fingerprint. No value wins
      # both; windows is the default because Cloudflare is far more common.
      # Set to `linux` here (or in the Komodo stack environment) to flip.
      STEALTH_PLATFORM: ${STEALTH_PLATFORM:-windows}

  rabbitmq:
    restart: unless-stopped
    # 722 MiB resident while every queue held *zero* messages (measured
    # 2026-08-19). `rabbitmqctl status` attributed 61% of that to quorum_ets,
    # and `erlang:memory()` confirmed 471 MiB of it is ETS -- against a WAL file
    # on disk of 7.7 MB last written on 30 June. So it is not backlog and not
    # traffic: all four queues (extract.jobs, extract.dlq, and the two nuq
    # prefetch queues) are `quorum` type, and Ra sizes its write-ahead-log mem
    # tables off wal_max_size_bytes, which was sitting at the 512 MiB default
    # (verified: application:get_env(ra, wal_max_size_bytes) -> 536870912).
    #
    # 64 MiB is still generous for four permanently-idle queues. The cost of a
    # smaller WAL is more frequent rollover to segment files, which is an SSD
    # write on a box that idles at 0.2% io pressure -- irrelevant here, and it
    # would be the wrong trade on the NAS's spinning disks.
    #
    # Measured after deploying this (2026-08-19): ETS 471 MiB -> 2.4 MiB, total
    # Erlang memory 583 MB -> 65 MB, container 722 MiB -> 145 MiB. Read that
    # honestly, though -- the container also *restarted*, and ra's WAL mem table
    # is built up at runtime rather than pre-allocated at boot, so a fresh node
    # would start small whatever this value was. What the setting durably buys
    # is the ceiling that accumulation runs into: ~64 MiB instead of ~471 MiB.
    # The steady state needs days of uptime to confirm, not minutes.
    #
    # NOTE: an earlier version of this comment claimed the mem_limit below and
    # this WAL size were load-bearing on each other, because RabbitMQ would
    # compute vm_memory_high_watermark as 0.4 of the cgroup limit once one was
    # set. That is wrong, and was checked: with mem_limit in force,
    # `rabbitmqctl status` on 3.13.7 still reports "0.4 of available memory,
    # computed to: 5.0195 gb" -- i.e. 0.4 of *host* RAM. It does not see the
    # cgroup at all. The two values are therefore independent, and the limit
    # can be lowered without touching the WAL.
    #
    # The real consequence of that runs the opposite way, and is why the
    # absolute watermark below is set rather than left at the default: a
    # watermark of 5.02 GiB sits far *above* the 1.465 GiB cgroup limit, so
    # RabbitMQ would never engage flow control -- the kernel would OOM-kill the
    # container first, and the only recovery is a restart. Because RabbitMQ
    # ignores the cgroup, the watermark has to be told the limit by hand.
    #
    # 1 GiB against a 1500M limit leaves ~465 MiB of headroom, which matters
    # because blocking publishers does not stop memory growth instantly. The
    # ordering is now: publishers block at 1 GiB, kernel kills at 1.465 GiB.
    # Keep that gap if you change either number.
    #
    # The {absolute,Bytes} tuple is an Erlang term parsed off the command line,
    # so it must contain no spaces. Verified before deploying, in a throwaway
    # rabbitmq:3.13.7 container with these exact args: it boots, and status
    # reports "Memory high watermark setting: 1.0737 gb, computed to:
    # 1.0737 gb" instead of the "0.4 of available memory" line. Worth redoing
    # that check if this string is ever edited -- a malformed term here does
    # not degrade, it stops the node from booting, and api's healthcheck
    # dependency then takes the whole stack down with it.
    mem_limit: 1500M
    memswap_limit: 1500M
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit quorum_commands_soft_limit 0 -ra wal_max_size_bytes 67108864 -rabbit vm_memory_high_watermark {absolute,1073741824}"
    healthcheck:
      # Upstream default (rabbitmq-diagnostics check_running, 5s interval/timeout) spawns a
      # fresh Erlang distribution node per check. Under any boot slowdown that pushes a single
      # check past 5s, checks pile up faster than they finish and the host CPU spirals.
      # This checks the AMQP port over plain TCP instead, no Erlang node required.
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/127.0.0.1/5672' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # FoundationDB is upstream's *experimental* queue backend, only wired in when
  # NUQ_BACKEND=fdb (see FDB_CLUSTER_FILE: ${NUQ_BACKEND:+...} in the base file).
  # This instance runs the queue on nuq-postgres, NUQ_BACKEND is empty, and
  # nothing depends_on foundationdb except its own init container -- so the two
  # containers are never created. Komodo then reports the stack "unhealthy"
  # forever, which trains you to ignore stack status.
  #
  # A profile makes them opt-in instead of deleting them from the upstream repo
  # (which auto_pull would clobber, and which an overlay cannot do anyway --
  # compose overlays merge, they cannot remove a service). Re-enable with
  # `--profile fdb` alongside NUQ_BACKEND=fdb.
  foundationdb:
    profiles: ["fdb"]

  foundationdb-init:
    profiles: ["fdb"]
